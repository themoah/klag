name: Trivy Security Scan

# PR + weekly schedule by design: the merge to main does not re-run what the
# PR already validated; the schedule covers supply-chain drift on main.
on:
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'website/**'
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC
  # Manual re-scan of main after a deps fix, so stale alerts close without waiting a week.
  workflow_dispatch:

# New pushes cancel stale in-progress PR runs instead of stacking them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy FS scan (repo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      # Fork PRs lack security-events: write; skip upload so the scan still runs.
      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
