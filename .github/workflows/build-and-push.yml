name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - 'website/**'

# New pushes cancel stale in-progress PR runs instead of stacking them.
# Pushes to main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      helm: ${{ steps.filter.outputs.helm }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            helm:
              - 'charts/**'
              - 'scripts/test-helm-chart.sh'
              - 'scripts/check-version-consistency.sh'
              - 'build.gradle.kts'
            plugin:
              - '.claude-plugin/**'
              - 'plugin/**'
              - 'scripts/check-plugin.sh'

  test-plugin:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    # The job runs a script from the checked-out ref: read-only token, no persisted credentials.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Claude Code plugin manifests
        run: ./scripts/check-plugin.sh

  test-helm-chart:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Run Helm chart tests
        run: ./scripts/test-helm-chart.sh

      - name: Check version consistency
        run: ./scripts/check-version-consistency.sh

  build-and-test:
    runs-on: ubuntu-latest
    needs: [changes, test-helm-chart]
    if: always() && (needs.test-helm-chart.result == 'success' || needs.test-helm-chart.result == 'skipped')
    strategy:
      matrix:
        jdk-version: [21, 25]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: gradle test

      - name: Assemble project
        run: gradle assemble

      - name: Build fat JAR
        run: gradle shadowJar

  # Validates the GraalVM native build (metadata hints stay correct).
  # PR-only: push-to-main runs just build-and-test; native was already
  # validated on the PR.
  native-build:
    runs-on: ubuntu-latest
    needs: [changes, test-helm-chart]
    if: github.event_name == 'pull_request' && always() && (needs.test-helm-chart.result == 'success' || needs.test-helm-chart.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM (JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile native image
        run: gradle nativeCompile --no-daemon
